; cursor-web-chat — Supervisor program 模板
; 安装到系统目录 (从仓库根目录执行, 需 root):
;   sudo ./deploy/install-supervisor.sh
; 脚本会解析本机 node 路径替换 __NODE_PATH__ 后写入
; /etc/supervisor/conf.d/cursor-web-chat.conf
;
; 注意:
;   - 按本机改 directory= / stdout_logfile= / HOME= / PORT=
;   - CURSOR_API_KEY 不进 Supervisor environment; 由 node --env-file-if-exists=.env 从仓库根 .env 加载
;   - 不要把含真实密钥的配置文件提交进 git
;   - 启动前先在本机执行过 npm install (依赖 tsx), 并在 .env 写好 CURSOR_API_KEY
;   - 默认 HOST 在代码里是 127.0.0.1; 若需对外监听请显式设 HOST 并配置 AUTH_TOKEN

[program:cursor-web-chat]
directory=/path/to/cursor-web-chat
command=__NODE_PATH__/node --env-file-if-exists=.env --import tsx src/server.ts
user=YOUR_USER
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/path/to/logs/cursor-web-chat
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PATH="__NODE_PATH__:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME="/home/YOUR_USER",USER="YOUR_USER",PORT="3080",AGENT_CACHE_MAX="8",AGENT_CACHE_IDLE_TTL_MS="1800000",AGENT_EXECUTOR_MAX_AGE_MS="2700000"

; 企微桥接(可选; 不用企微就整段删掉)。独立进程, 只经 HTTP 调上面那个服务。
;   - WECOM_BASE_URL 必须跟上面的 PORT 一致: 默认值是 3000, 漏配就一直 ECONNREFUSED
;   - WECOM_BOT_ID / WECOM_SECRET 同 CURSOR_API_KEY 惯例, 走 .env 不进本文件
;   - 同一个 bot 只允许一条长连接: 本机另起桥接或跑 scripts/wecom-contract-check.mjs 前须先 stop 本 program
[program:cursor-wecom]
directory=/path/to/cursor-web-chat
command=__NODE_PATH__/node --env-file-if-exists=.env --import tsx src/wecom/main.ts --cwd /path/to/your/workspace
user=YOUR_USER
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/path/to/logs/cursor-wecom
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PATH="__NODE_PATH__:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME="/home/YOUR_USER",USER="YOUR_USER",WECOM_BASE_URL="http://127.0.0.1:3080"
