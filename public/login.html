<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - Cursor Web Chat</title>
<style>
  :root {
    --bg: #f7f7f4;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2f6fed;
    --border: #ddd9d0;
    --danger: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", "Ubuntu Mono", ui-monospace, monospace;
    background: linear-gradient(160deg, #f7f7f4 0%, #ebe7de 100%);
    color: var(--fg);
  }
  .card {
    width: min(420px, 92vw);
    padding: 2rem 1.75rem;
    border: 1px solid var(--border);
    background: #fffcf7;
  }
  h1 {
    margin: 0 0 0.35rem;
    font-size: 1.15rem;
    font-weight: 600;
  }
  p {
    margin: 0 0 1.25rem;
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.45;
  }
  label {
    display: block;
    font-size: 0.8rem;
    margin-bottom: 0.4rem;
  }
  input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.75rem;
    border: 1px solid var(--border);
    background: #fff;
    font: inherit;
    margin-bottom: 0.85rem;
  }
  button {
    width: 100%;
    padding: 0.7rem;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error {
    min-height: 1.2rem;
    margin: 0.75rem 0 0;
    color: var(--danger);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="current-password">
    <h1>Cursor Web Chat</h1>
    <p>此实例启用了访问令牌。输入 <code>AUTH_TOKEN</code> 后继续。</p>
    <label for="token">访问令牌</label>
    <input id="token" name="token" type="password" required autofocus spellcheck="false">
    <button type="submit" id="submitBtn">进入</button>
    <p class="error" id="errorEl" role="alert"></p>
  </form>
  <script>
    const form = document.getElementById("loginForm");
    const tokenEl = document.getElementById("token");
    const errorEl = document.getElementById("errorEl");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: tokenEl.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errorEl.textContent = data.error || `登录失败 (${res.status})`;
          return;
        }
        location.href = "/";
      } catch (err) {
        errorEl.textContent = err instanceof Error ? err.message : String(err);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
